<!doctype html>
<!-- The feature graphic of the Google Play listing (1024 x 500). Open with ?lang=en or ?lang=ja and take
     a screenshot of 1024 x 500: store/feature-graphic-en.png and store/feature-graphic-ja.png. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: "Inter", "Noto Sans CJK JP", sans-serif; }
  .fg {
    position: relative; width: 1024px; height: 500px; overflow: hidden; color: #fff;
    background: radial-gradient(120% 150% at 22% 18%, #3A60EE 0%, #1F31A8 42%, #0B1046 100%);
  }
  /* a large faint ring of the "Q" in the background */
  .ring { position: absolute; right: -170px; top: -190px; width: 680px; height: 680px; border-radius: 50%;
          border: 92px solid rgba(255, 255, 255, .055); box-sizing: border-box; }
  .left { position: absolute; left: 60px; top: 0; bottom: 0; width: 480px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 24px; }
  .icon { width: 116px; height: 116px; flex: none; border-radius: 26px; overflow: hidden; position: relative;
          box-shadow: 0 12px 30px rgba(3, 8, 40, .55), 0 0 0 1.5px rgba(255, 255, 255, .28); }
  .icon img { position: absolute; width: 174px; height: 174px; left: -29px; top: -29px; }   /* the 72 x 72 middle of 108 x 108 */
  .name { font-size: 84px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .tag { margin-top: 28px; font-size: 31px; font-weight: 700; line-height: 1.32; letter-spacing: -.2px; }
  :lang(ja) .tag { font-size: 33px; letter-spacing: 0; }
  .pills { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { font-size: 20px; font-weight: 700; padding: 8px 16px 9px; border-radius: 999px; white-space: nowrap;
          background: rgba(255, 255, 255, .13); border: 1.5px solid rgba(255, 255, 255, .30); }
  .pill b { color: #FFC233; font-weight: 800; }
  .cards { position: absolute; left: 580px; top: 44px; width: 392px; }
  .card {
    background: rgba(255, 255, 255, .97); color: #161B33; border-radius: 18px;
    padding: 12px 20px 13px; margin-bottom: 14px; text-align: right;
    box-shadow: 0 12px 30px rgba(3, 8, 40, .45);
  }
  .card:nth-child(2) { margin-left: -34px; margin-right: 34px; }
  .card:nth-child(4) { margin-left: -34px; margin-right: 34px; }
  .e { font-size: 17px; color: #5E6785; font-family: "DejaVu Sans Mono", monospace; }
  .r { font-size: 26px; font-weight: 700; margin-top: 2px; white-space: nowrap; letter-spacing: -.2px; }
  .r.long { font-size: 23px; padding: 2px 0 1px; }   /* 21 digits: the result of pi with the precision set to 21 */
</style></head>
<body>
<div class="fg">
  <div class="ring"></div>
  <div class="left">
    <div class="brand">
      <div class="icon"><img src="../icon/qcalc-icon.svg" alt=""></div>
      <div class="name">QCalc</div>
    </div>
    <div class="tag" id="tag"></div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="cards">
    <div class="card"><div class="e">60 mph to km/h</div><div class="r">= 96.56064 km/h</div></div>
    <div class="card"><div class="e">integrate(x^2 sin(x), 0, pi)</div><div class="r">= π² − 4 ≈ 5.869604401</div></div>
    <div class="card"><div class="e">solve(x^2 − 5x + 6 = 0)</div><div class="r">= [3&nbsp;&nbsp;2]</div></div>
    <div class="card"><div class="e">pi</div><div class="r long">≈ 3.14159265358979323846</div></div>
  </div>
</div>
<script>
  const ja = new URLSearchParams(location.search).get('lang') === 'ja';
  document.documentElement.lang = ja ? 'ja' : 'en';
  document.getElementById('tag').innerHTML = ja ? '式のまま計算できる<br>多機能電卓' : 'Type math<br>the way you write it';
  const pills = ja ? ['<b>3D</b> グラフ', '最大 <b>20 万桁</b>', '<b>解析</b>（微分・積分）'] : ['<b>3D</b> graphs', 'Up to <b>200,000</b> digits', '<b>Calculus</b>'];
  document.getElementById('pills').innerHTML = pills.map((p) => '<span class="pill">' + p + '</span>').join('');
</script>
</body></html>
