// Settings for Android Studio (Gradle). It builds the same sources as the shell scripts (build-apk.sh, build-aab.sh), separately from them.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'QCalc'
include ':app'
