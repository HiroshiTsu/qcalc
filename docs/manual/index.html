<script>
(function () {
  var have = ["ja", "en", "de", "es", "fr", "ko", "zh-TW"], l = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
  l = /^zh-(TW|HK|MO|Hant)/i.test(l) ? 'zh-TW' : l.split('-')[0];
  if (!/[?&]stay/.test(location.search) && have.indexOf(l) >= 0) location.replace(l + '/' + location.hash);
})();
</script>
</head>
